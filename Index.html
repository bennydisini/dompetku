<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DompetKu - Personal Finance Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Styling tambahan untuk animasi dan perbaikan visual */
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-slide-up {
      animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }

    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f8fafc; /* slate-50 */
      -webkit-tap-highlight-color: transparent; /* Hilangkan efek tap biru di mobile */
    }
    
    /* Efek glassmorphism untuk header mobile */
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    
    /* Sembunyikan scrollbar bawaan agar tabel lebih rapi di desktop */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Komponen Ikon yang sudah diperbaiki menggunakan API Resmi Lucide
    const IconWrapper = ({ name, size = 24, className = "" }) => {
      const iconRef = React.useRef(null);
      
      useEffect(() => {
        if (iconRef.current) {
          iconRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
          if (window.lucide) {
            window.lucide.createIcons({
              root: iconRef.current,
              attrs: {
                class: className,
                width: size,
                height: size,
                stroke: 'currentColor',
                'stroke-width': '2',
                'stroke-linecap': 'round',
                'stroke-linejoin': 'round'
              }
            });
          }
        }
      }, [name, size, className]);

      return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
    };

    // --- MOCK DATA AWAL ---
    const initialWallets = [
      { id: 'w1', name: 'BCA Utama', type: 'Bank', initialBalance: 5000000 },
      { id: 'w2', name: 'GoPay', type: 'E-Wallet', initialBalance: 150000 },
      { id: 'w3', name: 'Uang Tunai', type: 'Cash', initialBalance: 300000 }
    ];

    const initialCategories = [
      { id: 'c1', type: 'expense', name: 'Makanan & Minuman' },
      { id: 'c2', type: 'expense', name: 'Transportasi' },
      { id: 'c3', type: 'expense', name: 'Tagihan & Utilitas' },
      { id: 'c4', type: 'income', name: 'Gaji Bulanan' },
      { id: 'c5', type: 'income', name: 'Bonus' }
    ];

    const initialTransactions = [
      { id: 't1', date: '2026-09-01', type: 'income', wallet_id: 'w1', category_id: 'c4', amount: 10000000, note: 'Gaji September' },
      { id: 't2', date: '2026-09-01', type: 'expense', wallet_id: 'w2', category_id: 'c1', amount: 50000, note: 'Makan Siang' },
      { id: 't3', date: '2026-09-02', type: 'transfer', wallet_id: 'w1', to_wallet_id: 'w2', amount: 500000, note: 'Topup GoPay' }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [wallets, setWallets] = useState(initialWallets);
      const [categories, setCategories] = useState(initialCategories);
      const [transactions, setTransactions] = useState(initialTransactions);
      const [isTxModalOpen, setIsTxModalOpen] = useState(false);
      
      const formatIDR = (number) => {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
      };

      const { walletBalances, totalBalance, totalIncome, totalExpense } = useMemo(() => {
        let balances = {};
        let tIncome = 0;
        let tExpense = 0;

        wallets.forEach(w => {
          balances[w.id] = { ...w, currentBalance: w.initialBalance };
        });

        transactions.forEach(tx => {
          const amount = Number(tx.amount);
          if (tx.type === 'income') {
            if (balances[tx.wallet_id]) balances[tx.wallet_id].currentBalance += amount;
            tIncome += amount;
          } else if (tx.type === 'expense') {
            if (balances[tx.wallet_id]) balances[tx.wallet_id].currentBalance -= amount;
            tExpense += amount;
          } else if (tx.type === 'transfer') {
            if (balances[tx.wallet_id]) balances[tx.wallet_id].currentBalance -= amount;
            if (balances[tx.to_wallet_id]) balances[tx.to_wallet_id].currentBalance += amount;
          }
        });

        const total = Object.values(balances).reduce((sum, w) => sum + w.currentBalance, 0);

        return { 
          walletBalances: Object.values(balances), 
          totalBalance: total,
          totalIncome: tIncome,
          totalExpense: tExpense
        };
      }, [wallets, transactions]);

      const handleAddTransaction = (newTx) => {
        setTransactions([{ ...newTx, id: `t${Date.now()}` }, ...transactions]);
        setIsTxModalOpen(false);
      };

      const Sidebar = () => (
        <div className="w-64 bg-[#0B1120] text-slate-300 min-h-screen hidden md:flex flex-col fixed h-full shadow-2xl z-50">
          <div className="p-6">
            <h1 className="text-2xl font-extrabold text-white flex items-center gap-2">
              <IconWrapper name="wallet-cards" className="text-emerald-400" /> DompetKu
            </h1>
            <p className="text-[11px] mt-1 text-slate-500 uppercase tracking-widest font-semibold">Finance Tracker</p>
          </div>
          <nav className="flex-1 px-4 space-y-1.5 mt-4">
            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-medium ${activeTab === 'dashboard' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800/50 hover:text-white text-slate-400'}`}>
              <IconWrapper name="layout-dashboard" size={20} /> Dashboard
            </button>
            <button onClick={() => setActiveTab('transactions')} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-medium ${activeTab === 'transactions' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800/50 hover:text-white text-slate-400'}`}>
              <IconWrapper name="arrow-right-left" size={20} /> Transaksi
            </button>
            <button onClick={() => setActiveTab('wallets')} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-medium ${activeTab === 'wallets' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800/50 hover:text-white text-slate-400'}`}>
              <IconWrapper name="wallet" size={20} /> Dompet
            </button>
            <button onClick={() => setActiveTab('categories')} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-medium ${activeTab === 'categories' ? 'bg-emerald-500/10 text-emerald-400' : 'hover:bg-slate-800/50 hover:text-white text-slate-400'}`}>
              <IconWrapper name="tags" size={20} /> Kategori
            </button>
          </nav>
        </div>
      );

      const MobileNav = () => (
        <div className="md:hidden bg-white text-slate-500 p-2 flex justify-around items-center fixed bottom-0 w-full z-40 border-t border-slate-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] safe-area-pb">
           <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center p-2 rounded-xl w-1/4 transition-colors ${activeTab === 'dashboard' ? 'text-emerald-600 font-medium' : 'hover:text-slate-800'}`}>
              <IconWrapper name="layout-dashboard" size={22} className="mb-1" />
              <span className="text-[10px]">Home</span>
            </button>
            <button onClick={() => setActiveTab('transactions')} className={`flex flex-col items-center p-2 rounded-xl w-1/4 transition-colors ${activeTab === 'transactions' ? 'text-emerald-600 font-medium' : 'hover:text-slate-800'}`}>
              <IconWrapper name="arrow-right-left" size={22} className="mb-1" />
              <span className="text-[10px]">History</span>
            </button>
            <button onClick={() => setActiveTab('wallets')} className={`flex flex-col items-center p-2 rounded-xl w-1/4 transition-colors ${activeTab === 'wallets' ? 'text-emerald-600 font-medium' : 'hover:text-slate-800'}`}>
              <IconWrapper name="wallet" size={22} className="mb-1" />
              <span className="text-[10px]">Dompet</span>
            </button>
        </div>
      );

      const DashboardView = () => (
        <div className="space-y-6 animate-fade-in">
          {/* Summary Cards */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
            <div className="bg-gradient-to-br from-slate-900 to-slate-800 p-6 rounded-3xl shadow-lg relative overflow-hidden text-white">
              <div className="absolute -top-4 -right-4 p-4 opacity-10 transform rotate-12">
                <IconWrapper name="wallet" size={100} />
              </div>
              <p className="text-slate-300 text-sm font-medium mb-1 relative z-10">Total Saldo (Semua Dompet)</p>
              <h2 className="text-3xl md:text-4xl font-extrabold tracking-tight relative z-10">{formatIDR(totalBalance)}</h2>
            </div>
            
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center justify-between group hover:shadow-md transition-shadow">
              <div>
                <p className="text-slate-500 text-sm font-medium mb-1">Total Pemasukan</p>
                <h2 className="text-2xl font-bold text-slate-800 tracking-tight">{formatIDR(totalIncome)}</h2>
              </div>
              <div className="bg-emerald-50 p-3 rounded-2xl group-hover:scale-110 transition-transform">
                <IconWrapper name="trending-up" className="text-emerald-600" size={28} />
              </div>
            </div>
            
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center justify-between group hover:shadow-md transition-shadow">
              <div>
                <p className="text-slate-500 text-sm font-medium mb-1">Total Pengeluaran</p>
                <h2 className="text-2xl font-bold text-slate-800 tracking-tight">{formatIDR(totalExpense)}</h2>
              </div>
              <div className="bg-rose-50 p-3 rounded-2xl group-hover:scale-110 transition-transform">
                <IconWrapper name="trending-down" className="text-rose-600" size={28} />
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Wallet List */}
            <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">
              <div className="flex justify-between items-center p-6 border-b border-slate-50">
                <h3 className="text-lg font-bold text-slate-800">Dompet Saya</h3>
                <button onClick={() => setActiveTab('wallets')} className="text-sm font-medium text-emerald-600 hover:text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg transition-colors">Lihat Semua</button>
              </div>
              <div className="p-4 space-y-2 flex-1">
                {walletBalances.map(w => (
                  <div key={w.id} className="flex justify-between items-center p-4 hover:bg-slate-50 rounded-2xl transition-colors border border-transparent hover:border-slate-100 cursor-default">
                    <div className="flex items-center gap-4">
                      <div className="bg-slate-100 p-3 rounded-xl">
                        <IconWrapper name="credit-card" className="text-slate-600" size={22} />
                      </div>
                      <div>
                        <p className="font-bold text-slate-800">{w.name}</p>
                        <p className="text-xs font-medium text-slate-500">{w.type}</p>
                      </div>
                    </div>
                    <p className="font-bold text-slate-700 text-lg tracking-tight">{formatIDR(w.currentBalance)}</p>
                  </div>
                ))}
              </div>
            </div>

            {/* Recent Transactions */}
            <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">
              <div className="flex justify-between items-center p-6 border-b border-slate-50">
                <h3 className="text-lg font-bold text-slate-800">Transaksi Terakhir</h3>
                <button onClick={() => setActiveTab('transactions')} className="text-sm font-medium text-emerald-600 hover:text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg transition-colors">Lihat Semua</button>
              </div>
              <div className="p-4 space-y-2 flex-1">
                {transactions.slice(0, 5).map(tx => {
                  const category = categories.find(c => c.id === tx.category_id);
                  const isTransfer = tx.type === 'transfer';
                  return (
                    <div key={tx.id} className="flex justify-between items-center p-4 hover:bg-slate-50 rounded-2xl transition-colors border border-transparent hover:border-slate-100 cursor-default">
                       <div className="flex items-center gap-4">
                        <div className={`p-3 rounded-xl ${tx.type === 'income' ? 'bg-emerald-100' : tx.type === 'expense' ? 'bg-rose-100' : 'bg-blue-100'}`}>
                          {tx.type === 'income' ? <IconWrapper name="trending-up" size={22} className="text-emerald-600" /> : 
                           tx.type === 'expense' ? <IconWrapper name="trending-down" size={22} className="text-rose-600" /> : 
                           <IconWrapper name="arrow-right-left" size={22} className="text-blue-600" />}
                        </div>
                        <div>
                          <p className="font-bold text-slate-800">{isTransfer ? 'Transfer Saldo' : category?.name || 'Lainnya'}</p>
                          <p className="text-xs font-medium text-slate-500 mt-0.5">{tx.note} • {tx.date}</p>
                        </div>
                      </div>
                      <p className={`font-bold tracking-tight ${tx.type === 'income' ? 'text-emerald-600' : tx.type === 'expense' ? 'text-rose-600' : 'text-slate-700'}`}>
                        {tx.type === 'expense' ? '-' : tx.type === 'income' ? '+' : ''}{formatIDR(tx.amount)}
                      </p>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );

      const TransactionsView = () => {
        const [filterType, setFilterType] = useState('all');
        const filteredTx = transactions.filter(tx => filterType === 'all' || tx.type === filterType);

        return (
          <div className="bg-white rounded-3xl shadow-sm border border-slate-100 flex flex-col animate-fade-in overflow-hidden">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center p-6 border-b border-slate-100 gap-4 bg-white z-10 relative">
              <h2 className="text-xl font-bold text-slate-800">Riwayat Transaksi</h2>
              <div className="flex gap-2 w-full sm:w-auto relative">
                <IconWrapper name="filter" size={16} className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" />
                <select 
                  className="bg-slate-50 border border-slate-200 text-slate-700 font-medium rounded-xl pl-9 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white w-full sm:w-auto appearance-none transition-colors"
                  value={filterType}
                  onChange={(e) => setFilterType(e.target.value)}
                >
                  <option value="all">Semua Jenis</option>
                  <option value="income">Pemasukan</option>
                  <option value="expense">Pengeluaran</option>
                  <option value="transfer">Transfer</option>
                </select>
              </div>
            </div>

            <div className="overflow-x-auto no-scrollbar">
              <table className="w-full text-left border-collapse min-w-[700px]">
                <thead>
                  <tr className="bg-slate-50/50 text-slate-500 text-xs uppercase tracking-wider">
                    <th className="p-5 font-semibold">Tanggal</th>
                    <th className="p-5 font-semibold">Keterangan</th>
                    <th className="p-5 font-semibold">Kategori</th>
                    <th className="p-5 font-semibold">Sumber Dana</th>
                    <th className="p-5 font-semibold text-right">Nominal</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-sm">
                  {filteredTx.map(tx => {
                    const category = categories.find(c => c.id === tx.category_id);
                    const wallet = wallets.find(w => w.id === tx.wallet_id);
                    const toWallet = wallets.find(w => w.id === tx.to_wallet_id);
                    
                    return (
                      <tr key={tx.id} className="hover:bg-slate-50/80 transition-colors group">
                        <td className="p-5 text-slate-500 whitespace-nowrap font-medium">{tx.date}</td>
                        <td className="p-5">
                          <p className="font-bold text-slate-800">{tx.note}</p>
                          {tx.type === 'transfer' && (
                            <p className="text-xs font-medium text-blue-600 flex items-center gap-1.5 mt-1 bg-blue-50 inline-flex px-2 py-0.5 rounded-md">
                              Ke: {toWallet?.name} <IconWrapper name="arrow-right" size={12}/>
                            </p>
                          )}
                        </td>
                        <td className="p-5">
                          {tx.type === 'transfer' ? 
                            <span className="bg-slate-100 text-slate-600 font-medium px-2.5 py-1 rounded-lg text-xs flex w-max items-center gap-1.5"><IconWrapper name="arrow-right-left" size={12}/>Transfer</span> : 
                            <span className="bg-slate-100 text-slate-600 font-medium px-2.5 py-1 rounded-lg text-xs flex w-max items-center gap-1.5"><IconWrapper name="tag" size={12}/>{category?.name}</span>}
                        </td>
                        <td className="p-5 text-slate-600 font-medium">{wallet?.name}</td>
                        <td className={`p-5 text-right font-bold whitespace-nowrap tracking-tight text-base ${tx.type === 'income' ? 'text-emerald-600' : tx.type === 'expense' ? 'text-rose-600' : 'text-slate-800'}`}>
                          {tx.type === 'expense' ? '-' : tx.type === 'income' ? '+' : ''}{formatIDR(tx.amount)}
                        </td>
                      </tr>
                    )
                  })}
                </tbody>
              </table>
              
              {filteredTx.length === 0 && (
                 <div className="flex flex-col items-center justify-center py-20 text-slate-400">
                    <div className="bg-slate-50 p-4 rounded-full mb-3"><IconWrapper name="search-x" size={32} /></div>
                    <p className="font-medium text-slate-500">Tidak ada transaksi ditemukan.</p>
                 </div>
              )}
            </div>
          </div>
        );
      };

      const TransactionModal = () => {
        if (!isTxModalOpen) return null;
        
        const [txType, setTxType] = useState('expense');
        const todayStr = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
        
        const [formData, setFormData] = useState({
          date: todayStr,
          amount: '',
          wallet_id: wallets[0]?.id || '',
          to_wallet_id: wallets.length > 1 ? wallets[1].id : '',
          category_id: categories.find(c => c.type === 'expense')?.id || '',
          note: ''
        });

        const filteredCategories = categories.filter(c => c.type === txType);

        const handleSubmit = (e) => {
          e.preventDefault();
          handleAddTransaction({
            ...formData,
            type: txType,
            amount: Number(formData.amount)
          });
        };

        return (
          <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center z-[100] sm:p-4 transition-opacity">
            <div className="bg-white rounded-t-[32px] sm:rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-slide-up flex flex-col max-h-[90vh]">
              <div className="flex justify-between items-center p-6 border-b border-slate-100 bg-white sticky top-0 z-10">
                <h2 className="text-xl font-bold text-slate-800">Catat Transaksi</h2>
                <button onClick={() => setIsTxModalOpen(false)} className="text-slate-400 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 p-2 rounded-full transition-colors">
                   <IconWrapper name="x" size={20} />
                </button>
              </div>
              
              <div className="p-6 overflow-y-auto no-scrollbar">
                {/* Custom Segmented Control */}
                <div className="flex bg-slate-100 p-1 rounded-xl mb-6 shadow-inner relative">
                  <button type="button" onClick={() => setTxType('expense')} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all z-10 ${txType === 'expense' ? 'bg-white text-rose-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Pengeluaran</button>
                  <button type="button" onClick={() => setTxType('income')} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all z-10 ${txType === 'income' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Pemasukan</button>
                  <button type="button" onClick={() => setTxType('transfer')} className={`flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all z-10 ${txType === 'transfer' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Transfer</button>
                </div>

                <form onSubmit={handleSubmit} className="space-y-5">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nominal (Rp)</label>
                    <div className="relative">
                      <span className="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 font-bold text-lg">Rp</span>
                      <input required type="number" min="1" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} className="w-full bg-slate-50 hover:bg-slate-100 focus:bg-white border border-slate-200 rounded-2xl pl-12 pr-4 py-3.5 text-xl font-extrabold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all placeholder:text-slate-300" placeholder="0" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Tanggal</label>
                      <input required type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full bg-slate-50 hover:bg-slate-100 focus:bg-white border border-slate-200 rounded-2xl px-4 py-3 font-medium text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none transition-all" />
                    </div>
                    
                    {txType !== 'transfer' && (
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Kategori</label>
                        <select required value={formData.category_id} onChange={e => setFormData({...formData, category_id: e.target.value})} className="w-full bg-slate-50 hover:bg-slate-100 focus:bg-white border border-slate-200 rounded-2xl px-4 py-3 font-medium text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none transition-all appearance-none">
                          <option value="" disabled>Pilih</option>
                          {filteredCategories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                        </select>
                      </div>
                    )}
                  </div>

                  <div className={txType === 'transfer' ? 'grid grid-cols-1 sm:grid-cols-2 gap-4' : ''}>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">{txType === 'transfer' ? 'Dari Dompet' : 'Sumber Dana'}</label>
                      <select required value={formData.wallet_id} onChange={e => setFormData({...formData, wallet_id: e.target.value})} className="w-full bg-slate-50 hover:bg-slate-100 focus:bg-white border border-slate-200 rounded-2xl px-4 py-3 font-medium text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none transition-all appearance-none">
                        {wallets.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
                      </select>
                    </div>
                    
                    {txType === 'transfer' && (
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Ke Dompet</label>
                        <select required value={formData.to_wallet_id} onChange={e => setFormData({...formData, to_wallet_id: e.target.value})} className="w-full bg-slate-50 hover:bg-slate-100 focus:bg-white border border-slate-200 rounded-2xl px-4 py-3 font-medium text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none transition-all appearance-none">
                          <option value="" disabled>Pilih Tujuan</option>
                          {wallets.filter(w => w.id !== formData.wallet_id).map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
                        </select>
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Catatan</label>
                    <input required type="text" value={formData.note} onChange={e => setFormData({...formData, note: e.target.value})} className="w-full bg-slate-50 hover:bg-slate-100 focus:bg-white border border-slate-200 rounded-2xl px-4 py-3 font-medium text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none transition-all placeholder:text-slate-400" placeholder="Contoh: Makan siang bareng teman" />
                  </div>

                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-lg py-4 px-4 rounded-2xl transition-all mt-6 shadow-lg shadow-emerald-600/30 active:scale-[0.98]">
                    Simpan Transaksi
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="flex min-h-screen bg-[#F1F5F9] font-sans md:pl-64">
          <Sidebar />
          
          <main className="flex-1 w-full pb-24 md:pb-8 flex flex-col min-h-screen">
            {/* Header Mobile - Glassmorphism */}
            <div className="md:hidden glass-header p-4 flex justify-between items-center sticky top-0 z-30 border-b border-slate-200/50">
              <h1 className="text-xl font-extrabold text-slate-800 flex items-center gap-2">
                <IconWrapper name="wallet-cards" className="text-emerald-500" /> DompetKu
              </h1>
              <div className="w-8 h-8 bg-slate-200 rounded-full flex items-center justify-center overflow-hidden border border-slate-300">
                 <IconWrapper name="user" size={16} className="text-slate-500" />
              </div>
            </div>

            {/* Header Desktop */}
            <header className="hidden md:flex justify-between items-center p-8 bg-[#F1F5F9] sticky top-0 z-30">
              <div>
                <h2 className="text-3xl font-extrabold text-slate-800 capitalize tracking-tight">{activeTab === 'dashboard' ? 'Ringkasan Keuangan' : activeTab}</h2>
                <p className="text-sm font-medium text-slate-500 mt-1">Kelola pencatatan keuangan harian Anda dengan mudah.</p>
              </div>
              <button 
                onClick={() => setIsTxModalOpen(true)}
                className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-2xl font-bold flex items-center gap-2 transition-all shadow-lg shadow-emerald-600/20 active:scale-95"
              >
                <IconWrapper name="plus" size={20} /> Transaksi Baru
              </button>
            </header>

            {/* Floating Action Button untuk Mobile */}
            <button 
              onClick={() => setIsTxModalOpen(true)}
              className="md:hidden fixed bottom-24 right-4 bg-emerald-600 text-white p-4 rounded-2xl shadow-xl shadow-emerald-600/30 hover:bg-emerald-700 transition-transform active:scale-90 z-30"
            >
              <IconWrapper name="plus" size={26} strokeWidth="3" />
            </button>

            {/* Area Konten Utama */}
            <div className="p-4 md:px-8 flex-1 max-w-7xl mx-auto w-full">
              {activeTab === 'dashboard' && <DashboardView />}
              {activeTab === 'transactions' && <TransactionsView />}
              
              {activeTab === 'wallets' && (
                 <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-8 animate-fade-in">
                   <div className="flex items-center gap-3 mb-2">
                     <div className="bg-emerald-100 text-emerald-600 p-2 rounded-xl"><IconWrapper name="wallet" size={24} /></div>
                     <h2 className="text-2xl font-bold text-slate-800">Manajemen Dompet</h2>
                   </div>
                   <p className="text-slate-500 font-medium mb-8">Daftar sumber dana yang Anda miliki saat ini.</p>
                   <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                     {walletBalances.map(w => (
                       <div key={w.id} className="border border-slate-200 bg-slate-50/50 p-6 rounded-2xl hover:shadow-md transition-shadow hover:border-emerald-200 group relative overflow-hidden">
                          <div className="absolute -bottom-4 -right-4 opacity-[0.03] group-hover:opacity-[0.08] transition-opacity transform group-hover:scale-110">
                            <IconWrapper name="wallet" size={100} />
                          </div>
                          <div className="relative z-10">
                            <h3 className="font-bold text-xl text-slate-800">{w.name}</h3>
                            <p className="text-sm font-semibold text-slate-500 mb-4 bg-slate-200/50 inline-block px-2.5 py-1 rounded-lg mt-1">{w.type}</p>
                            <p className="text-3xl font-extrabold tracking-tight text-emerald-600">{formatIDR(w.currentBalance)}</p>
                          </div>
                       </div>
                     ))}
                   </div>
                 </div>
              )}
              
              {activeTab === 'categories' && (
                 <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-8 animate-fade-in max-w-4xl">
                   <div className="flex items-center gap-3 mb-2">
                     <div className="bg-indigo-100 text-indigo-600 p-2 rounded-xl"><IconWrapper name="tags" size={24} /></div>
                     <h2 className="text-2xl font-bold text-slate-800">Kategori Transaksi</h2>
                   </div>
                   <p className="text-slate-500 font-medium mb-8">Klasifikasi untuk membedakan jenis pengeluaran dan pemasukan Anda.</p>
                   <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                     {categories.map(c => (
                       <div key={c.id} className="flex items-center gap-4 p-4 border border-slate-100 rounded-2xl hover:bg-slate-50 transition-colors cursor-default">
                          <div className={`p-3 rounded-xl shadow-sm ${c.type === 'income' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}`}>
                            <IconWrapper name={c.type === 'income' ? 'arrow-down-to-line' : 'arrow-up-from-line'} size={20} />
                          </div>
                          <div className="flex-1">
                            <h4 className="font-bold text-slate-800 text-lg">{c.name}</h4>
                          </div>
                          <span className={`px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-widest ${c.type === 'income' ? 'bg-emerald-50 text-emerald-700 border border-emerald-100' : 'bg-rose-50 text-rose-700 border border-rose-100'}`}>{c.type}</span>
                       </div>
                     ))}
                   </div>
                 </div>
              )}
            </div>
          </main>

          <MobileNav />
          <TransactionModal />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
